<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard KP4 Disdikpora</title>
    <!-- Library Essentials -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://cdn.jsdelivr.net"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---
        const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2""")/>><circle cx="9" cy="7" r="4""")/>><path d="M22 21v-2a4 4 0 0 0-3-3.87""")/>><path d="M16 3.13a4 4 0 0 1 0 7.75""")/>></svg>;
        const IconBriefcase = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2""")/>><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16""")/>></svg>;
        const IconWallet = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4""")/>><path d="M3 5v14a2 2 0 0 0 2 2h16v-5""")/>><path d="M18 12a2 2 0 0 0 0 4h4v-4Z""")/>></svg>;
        const IconActivity = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2""")/>></svg>;

        // --- DATA GENERATOR ---
        const generateMockData = () => {
            const data = [];
            const jk = ['Laki-Laki', 'Perempuan'];
            const status = ['PNS', 'PPPK', 'Honorer'];
            const unit = ['Dinas Pendidikan', 'Sekretariat', 'BAPPEDA'];
            for (let i = 0; i < 100; i++) {
                data.push({
                    'NAMA': `Pegawai ${i+1}`,
                    'JENIS KELAMIN': jk[Math.floor(Math.random() * jk.length)],
                    'STATUS KEPEGAWAIAN': status[Math.floor(Math.random() * status.length)],
                    'UNIT KERJA': unit[Math.floor(Math.random() * unit.length)],
                    'GAJI POKOK': Math.floor(Math.random() * 5000000) + 3000000
                });
            }
            return data;
        };

        // --- CHART COMPONENT ---
        const ChartComponent = ({ type, data, title }) => {
            const canvasRef = useRef(null);
            const chartInstance = useRef(null);
            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = canvasRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: type,
                    data: data,
                    options: { responsive: true, maintainAspectRatio: false }
                });
                return () => chartInstance.current?.destroy();
            }, [data]);
            return (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-[350px]">
                    <h3 className="font-bold text-slate-700 mb-4">{title}</h3>
                    <div className="relative h-64"><canvas ref={canvasRef}></canvas></div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [data] = useState(generateMockData());

            const jkData = {
                labels: ['Laki-Laki', 'Perempuan'],
                datasets: [{ 
                    data: [data.filter(d => d['JENIS KELAMIN'] === 'Laki-Laki').length, data.filter(d => d['JENIS KELAMIN'] === 'Perempuan').length],
                    backgroundColor: ['#6366f1', '#ec4899']
                }]
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <header className="mb-8 flex items-center gap-3">
                        <div className="bg-indigo-600 p-2 rounded-lg text-white"><IconActivity /></div>
                        <h1 className="text-2xl font-bold text-slate-800">Dashboard KP4 Disdikpora</h1>
                    </header>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500">
                            <div className="text-slate-500 text-sm flex items-center gap-2"><IconUsers /> Total Pegawai</div>
                            <div className="text-3xl font-bold mt-1 text-slate-800">{data.length}</div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <ChartComponent type="pie" data={jkData} title="Distribusi Jenis Kelamin" />
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-auto max-h-[350px]">
                            <h3 className="font-bold text-slate-700 mb-4">Daftar Pegawai</h3>
                            <table className="w-full text-sm text-left">
                                <thead className="text-xs text-slate-500 uppercase bg-slate-50">
                                    <tr><th className="px-4 py-2">Nama</th><th className="px-4 py-2">Unit</th></tr>
                                </thead>
                                <tbody>
                                    {data.slice(0, 10).map((p, i) => (
                                        <tr key={i} className="border-b"><td className="px-4 py-2">{p.NAMA}</td><td className="px-4 py-2">{p['UNIT KERJA']}</td></tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
